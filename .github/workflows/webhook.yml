name: Webhook Event Example

on:
  repository_dispatch:
    types: 
        - webhook

jobs:
  respond-to-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Run a script
        run: |
          echo "GitHub event: $GITHUB_EVENT_NAME"
          echo "Dispatch type: ${{ github.event.action }}"