name: context-Examples

on:
    push:
        branches:
            - main

jobs:
    my-context:
        runs-on: ubuntu-latest
        steps:
            - name: "My step"
              env:
                MY_ACTION: ${{ github.action }}
                MY_ACTOR: ${{ github.actor }}
              run: | 
                echo "Hello! $MY_ACTION"
                echo "Hello! $MY_ACTOR"